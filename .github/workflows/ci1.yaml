name: Terraform Checks
# Testing 
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      # Verify Terraform version
      - name: Terraform Version
        run: terraform version
      
        # Terraform initialization
      - name: Terraform Init
        run: terraform init -backend=false -upgrade -no-color
      

      # Terraform formatting check
      - name: Terraform Format
        run: terraform fmt -check -recursive

      

      # Debug providers and folders
      - name: Debug Terraform Directory
        run: |
          pwd
          ls -la
          ls -la .terraform || true
          find .terraform || true

      # Terraform validation
      - name: Terraform Validate
        run: terraform validate -no-color

      # Install TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # Run TFLint
      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # Optional: Snyk IaC Security Scan
      # Uncomment after configuring SNYK_TOKEN secret

      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # - name: Install Snyk
      #   run: npm install -g snyk

      # - name: Authenticate Snyk
      #   run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # - name: Run Snyk IaC Scan
      #   run: snyk iac test
  snyk-checks:
    runs-on: ubuntu-latest
    needs: terraform-checks
    outputs:
      status: ${{ job.status }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Snyk CLI
      uses: snyk/actions/setup@master

    # 1. Snyk Code Test (Static Application Security Testing / SAST)
    - name: Snyk Code Test
      run: snyk code test
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    # 2. Snyk Test (Open Source Software Vulnerabilities & License Compliance)
    - name: Snyk Open Source Test
      run: snyk test
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    # 3. Snyk IaC Test (Infrastructure as Code security compliance for Terraform)
    - name: Snyk IaC Test
      run: snyk iac test
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    # 4. Build Docker Image (Safely skips if no Dockerfile is found in root)
    - name: Build Docker Image
      run: |
        if [ -f Dockerfile ]; then
          docker build -t "snyk-image" .
        else
          echo "No Dockerfile found, skipping Docker build step."
        fi
          
    # 5. Snyk Container Test (Scans image layers for OS level vulnerabilities)
    - name: Snyk Container Test
      run: |
        if [ -f Dockerfile ]; then
          snyk container test "snyk-image" --severity-threshold=high
        else
          echo "No Dockerfile found, skipping Container scan."
        fi
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  summary:
    needs: [terraform-checks, snyk-checks]
    runs-on: ubuntu-latest
    if: always() # Forces execution even if compilation maps or upstream checks fail
    steps:
      - name: Adding markdown
        run: |
          TF_STATUS="${{ needs.terraform-checks.result }}"
          SNYK_STATUS="${{ needs.snyk-checks.result }}"

          echo '## 🚀 Preparing Build Summary 🚀' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

          echo "| Job Name        | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| tf-check        | $TF_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| snyk-check      | $SNYK_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

          echo '## Job ran by: ${{ github.actor }}' >> $GITHUB_STEP_SUMMARY